<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food-Net</title>

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0b0b0e;
  color:#fff;
}

/* TOPBAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:16px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:999;
  backdrop-filter:blur(10px);
  background:rgba(10,10,14,0.6);
}

.brand{
  font-weight:bold;
  font-size:18px;
}

.logo img{
  height:36px;
  opacity:.9;
}

/* HERO */
.hero{
  height:85vh;
  display:flex;
  align-items:flex-end;
  padding:60px 24px;
  background:linear-gradient(to top,#0b0b0e,transparent), url('img/pic/Fela.png');
  background-size:cover;
  background-position:center;
}

.hero-content h1{
  font-size:42px;
  margin:0;
}

.hero-content p{
  color:#aaa;
  margin-top:10px;
}

/* SECTION */
.section{
  padding:60px 20px;
  max-width:1100px;
  margin:auto;
}

h2{
  margin-bottom:20px;
}

/* SEARCH */
.search-box{
  margin-bottom:20px;
}

.search-box input{
  width:100%;
  padding:12px 16px;
  border-radius:10px;
  border:none;
  background:#17171d;
  color:white;
}

/* GRID */
.market-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:16px;
}

@media(max-width:600px){
  .market-grid{
    grid-template-columns:repeat(3,1fr);
  }
}

/* CARD */
.unit-card{
  background:#14141b;
  border-radius:16px;
  padding:10px;
  cursor:pointer;
  transition:.2s;
}

.unit-card:hover{
  transform:translateY(-4px);
}

.unit-img{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  overflow:hidden;
}

.unit-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.unit-info{
  margin-top:8px;
}

.unit-info h3{
  margin:0;
  font-size:14px;
}

.unit-info p{
  margin:2px 0 0;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="topbar">
  <div class="brand">Food-Net</div>
  <div class="logo">
    <img src="iaf-logo.png">
  </div>
</div>

<section class="hero">
  <div class="hero-content">
    <h1>Explore Food Around You</h1>
    <p>Find, share, and discover places effortlessly</p>
  </div>
</section>

<section class="section">

  <div class="search-box">
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search food / place..."
      oninput="filterUnits()"
    >
  </div>

  <h2>Catalog</h2>
  <div class="market-grid" id="market"></div>

</section>

<script>
let allUnits = [];
let userLat = null;
let userLng = null;

/* =========================
   GET USER LOCATION
========================= */
navigator.geolocation.getCurrentPosition(
  pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;

    if(allUnits.length){
      sortByDistance();
      renderUnits(allUnits);
    }
  },
  err => {
    console.warn("Lokasi ditolak / gagal:", err);
  }
);

/* =========================
   LOAD JSON
========================= */
async function loadCatalog(){
  try{
    const res = await fetch("data.json");
    const data = await res.json();

    allUnits = Object.values(data.personnel);

    sortByDistance();
    renderUnits(allUnits);

  }catch(err){
    console.error(err);
  }
}

/* =========================
   DISTANCE FUNCTION
========================= */
function getDistance(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

/* =========================
   SORT
========================= */
function sortByDistance(){
  if(!userLat) return;

  allUnits.sort((a,b)=>{
    if(!a.lat || !a.lng) return 1;
    if(!b.lat || !b.lng) return -1;

    const d1 = getDistance(userLat, userLng, a.lat, a.lng);
    const d2 = getDistance(userLat, userLng, b.lat, b.lng);

    return d1 - d2;
  });
}

/* =========================
   RENDER
========================= */
function renderUnits(units){
  const market = document.getElementById("market");
  market.innerHTML = "";

  units.forEach(fp => {

    let distanceText = fp.subtitle || "";

    if(userLat && userLng && fp.lat && fp.lng){
      const dist = getDistance(userLat, userLng, fp.lat, fp.lng);

      distanceText = dist < 1
        ? (dist * 1000).toFixed(0) + " m"
        : dist.toFixed(1) + " km";
    }

    const card = document.createElement("div");
    card.className = "unit-card";

    card.innerHTML = `
      <div class="unit-img">
        <img src="${fp.profile}">
      </div>
      <div class="unit-info">
        <h3>${fp.name}</h3>
        <p>${distanceText}</p>
      </div>
    `;

    card.onclick = ()=>{
      window.location.href = "Furru.html?id=" + fp.sn;
    };

    market.appendChild(card);
  });
}

/* =========================
   SEARCH
========================= */
function filterUnits(){
  const keyword = document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const filtered = allUnits.filter(fp => 
    fp.name.toLowerCase().includes(keyword) ||
    (fp.model || "").toLowerCase().includes(keyword) ||
    fp.sn.toLowerCase().includes(keyword)
  );

  renderUnits(filtered);
}

loadCatalog();
</script>

</body>
</html>
